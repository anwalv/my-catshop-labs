name: Lab 02 - Test, Build, Publish

on:
  push:
    branches: ["**"]
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"
  pull_request:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-02
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest suite
        run: pytest -v

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image name and tag
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ env.REGISTRY }}/${OWNER}/catshop-lab-02:sha-${SHORT_SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and export to tar
        uses: docker/build-push-action@v6
        with:
          context: ./lab-02
          file: ./lab-02/Dockerfile
          tags: ${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=/tmp/catshop-image.tar

      - name: Upload built image artifact
        uses: actions/upload-artifact@v4
        with:
          name: catshop-image
          path: /tmp/catshop-image.tar
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: catshop-image
          path: /tmp

      - name: Load image into Docker
        run: docker load -i /tmp/catshop-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          IMAGE="${{ needs.build.outputs.image_tag }}"
          docker push "${IMAGE}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}")
          echo "Published digest: ${DIGEST}"